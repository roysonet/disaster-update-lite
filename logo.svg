<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
      <!-- Background gradient -->
      <defs>
        <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#6a11cb;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#2575fc;stop-opacity:1" />
        </linearGradient>
      </defs>
      <rect width="400" height="200" fill="url(#gradient)" rx="20" />

      <!-- Code brackets -->
      <g transform="translate(20, 50)" fill="none" stroke="#ffffff" stroke-width="4">
        <path d="M10 10 L30 10 L30 90 L10 90 Z" />
        <path d="M70 10 L90 10 L90 90 L70 90 Z" />
      </g>

      <!-- Text: </sonet.dev> -->
      <text x="120" y="80" font-family="'Courier New', monospace" font-size="40" fill="#ffffff" font-weight="bold">
        <tspan fill="#ff6b6b">&lt;</tspan>
        <tspan fill="#ffffff">/sonet.dev</tspan>
        <tspan fill="#ff6b6b">&gt;</tspan>
      </text>

      <!-- Code symbol accents -->
      <g transform="translate(320, 50)" fill="#ffffff">
        <circle cx="10" cy="10" r="5" />
        <circle cx="30" cy="30" r="5" />
        <circle cx="50" cy="50" r="5" />
      </g>
    </svg>
